# /etc/nginx/sites-available/wackgrok
#
# Routing summary:
#   *.wackgrok.paskhal.com  :80  →  nginx  →  localhost:8467  (wackgrok HTTP)
#   *.wackgrok.paskhal.com  :7070 / :7071  →  Docker directly (raw TCP, no nginx needed)
#
# DNS requirement:
#   *.wackgrok.paskhal.com  A  <VPS IP>
#   wackgrok.paskhal.com    A  <VPS IP>   (optional root, shown below)

server {
    listen 80;
    server_name *.wackgrok.paskhal.com wackgrok.paskhal.com;

    # Pass the original Host header through so wackgrok can extract the subdomain.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Disable buffering so streaming responses (SSE, chunked) work correctly.
    proxy_buffering          off;
    proxy_request_buffering  off;

    # Keep the upstream connection alive long enough for slow clients.
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:8467;
        # Allow HTTP/1.1 keep-alive to the upstream.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# ─── TCP passthrough for control (7070) and data (7071) ──────────────────────
# The wackgrok client connects to these ports directly.
# Docker already maps 7070:7070 and 7071:7071, so nginx does NOT need to touch
# them — clients reach the container straight through the host firewall.
#
# If you want nginx to front the TCP ports too (e.g. for ACLs or logging),
# add the block below to your /etc/nginx/nginx.conf inside a `stream {}` context
# and ensure nginx is built with --with-stream:
#
# stream {
#     server {
#         listen 7070;
#         proxy_pass 127.0.0.1:7070;
#     }
#     server {
#         listen 7071;
#         proxy_pass 127.0.0.1:7071;
#     }
# }
