# /etc/nginx/sites-available/wackgrok
# Managed jointly with Certbot. Replace paths if your cert name differs.

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name *.wackgrok.paskhal.com wackgrok.paskhal.com;

    # Certbot redirect for plain subdomains
    if ($host ~ ^[^.]+\.wackgrok\.paskhal\.com$) {
        return 301 https://$host$request_uri;
    }
    if ($host = wackgrok.paskhal.com) {
        return 301 https://$host$request_uri;
    }

    return 404;
}

# ── HTTPS proxy → wackgrok container ─────────────────────────────────────────
server {
    listen 443 ssl;
    server_name *.wackgrok.paskhal.com wackgrok.paskhal.com;

    # Certbot-managed certificates
    ssl_certificate     /etc/letsencrypt/live/wackgrok.paskhal.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wackgrok.paskhal.com-0001/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Disable buffering so streaming / chunked responses work.
    proxy_buffering         off;
    proxy_request_buffering off;

    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:8467;

        # IMPORTANT: all proxy_set_header directives must live here, not in the
        # server block. nginx drops parent-level proxy_set_header values the
        # moment any proxy_set_header appears in a location block.
        proxy_http_version 1.1;
        proxy_set_header Connection     "";
        proxy_set_header Host           $host;        # wackgrok reads this to route tunnels
        proxy_set_header X-Real-IP      $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
